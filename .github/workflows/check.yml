# The site as visitors get it: runbun's pinned release archive, configured by hosting.json, served, and each project
# run in headless Chrome (scripts/check.ts). On every push and pull request, and weekly, so a broken download or a
# moved npm package shows up before a visitor finds it. Then, on main, deploy to solid.runbun.dev when the repository
# has a CLOUDFLARE_API_TOKEN secret (Workers Scripts:Edit and the runbun.dev zone's DNS and Workers Routes).
name: Check and deploy

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          CHROME: /usr/bin/google-chrome

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::no CLOUDFLARE_API_TOKEN secret: not deploying"
            exit 0
          fi
          pnpm run deploy
          echo "deployed=1" >> "$GITHUB_OUTPUT"
        id: deploy
      # The live site, once deployed: its headers, and each project running from it.
      - name: Check solid.runbun.dev
        if: steps.deploy.outputs.deployed == '1'
        run: pnpm check --url https://solid.runbun.dev
        env:
          CHROME: /usr/bin/google-chrome
